<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App de orientación para estudiar</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: black;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .contenedor {
      max-width: 800px;
      padding: 20px;
    }

    h1 {
      font-size: 60px;
      margin-bottom: 30px;
    }

    p {
      font-size: 28px;
      margin-bottom: 40px;
    }

    button {
      background-color: white;
      color: black;
      border: none;
      padding: 18px 40px;
      font-size: 24px;
      border-radius: 15px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body>
  <div class="contenedor">
    <h1>App de orientación para estudiar</h1>

    <p>
      Organiza tu tiempo, mejora tus hábitos y alcanza tus metas académicas.
    </p>

    <button>Comenzar</button>
  </div>
</body>
</html>
